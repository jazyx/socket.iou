<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script defer src="js/script.js"></script>
  <script defer src="js/socketio.js"></script>
  <script defer src="js/websocket.js"></script>
  <title>Socket MVP</title>
</head>
<body>
  <main>
    <header>
      <a href="#socket-io">Socket.IO</a>
      <a href="#websocket" class="current">WebSocket</a>
    </header>
    <p id="frontend"></p>
    <select id="backend">
      <option value="http://localhost:6661">http://localhost:6661</option>
      <option value="https://iou.jazyx.com">https://iou.jazyx.com</option>
    </select>

    <div id="socket-io">
      <p>Connected: <span class="connected"></span></p>
      <div class="buttons">
        <button
          type="button"
          class="connect"
        >
          Connect
        </button>
        <button
          type="button"
          class="disconnect"
        >
          Disconnect
        </button>
      </div>
      <form>
        <span>Log in as:</span>
        <input
          class="username"
          type="text"
        />
      </form>
      <ul class="messages"></ul>
    </div>

    <div id="websocket">
      <p>Connected: <span class="connected"></span></p>
      <div class="buttons">
        <button
          type="button"
          class="connect"
        >
          Connect
        </button>
        <button
          type="button"
          class="disconnect"
        >
          Disconnect
        </button>
      </div>
      <form>
        <span>Log in as:</span>
        <input
          class="username"
          type="text"
        />
      </form>
      <ul class="messages"></ul>
    </div>
  </main>
</body>
</html>
