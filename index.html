<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

  <!-- Create global SocketConsole -->
  <script defer src="js/socketconsole.js"></script>
  <!-- Create global GameSocket -->
  <script defer src="js/gamesocket.js"></script>

  <script defer src="js/placeholdergame.js"></script>
  <title>Socket MVP</title>
</head>
<body>
  <main>
    <p id="frontend"></p>
    <select id="backend">
      <option
        value="http://localhost:6661"
      >
        http://localhost:6661
      </option>
      <option
        value="https://iou.jazyx.com"
        select_ed
      >
        https://iou.jazyx.com
      </option>
    </select>

    <p>Connected: <span id="connected"></span></p>
    <div id="buttons">
      <button
        type="button"
        id="connect"
      >
        Connect
      </button>
      <button
        type="button"
        id="disconnect"
      >
        Disconnect
      </button>
      <button
        type="button"
        id="toggleWait"
      >
        Is IDLE
      </button>
    </div>
    <form id="form">
      <span>Log in as </span>
      <input
        id="username"
        type="text"
        value="WebSocket"
      />
    </form>
    <ul id="messages"></ul>
  </main>
</body>
</html>
